name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Determinism guard (src/core stays pure)
        run: node scripts/check-determinism.mjs

      - name: Build extension
        run: npm run build

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: better-browser-history-unpacked
          path: dist/
